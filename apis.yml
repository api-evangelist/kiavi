name: Kiavi
description: 'Kiavi (formerly LendingHome) is a technology-driven private lender for residential real
  estate investors, providing fix-and-flip bridge loans, new-construction financing, and DSCR rental
  loans across 49 states plus Washington, D.C. The company has originated more than $30 billion in loans
  and funded over 100,000 investment properties, pairing a digital application and portfolio-management
  experience with institutional capital. Kiavi is backed by Cowboy Ventures and Ribbit Capital. As of
  this enrichment pass Kiavi publishes no public developer API, OpenAPI, or developer portal; its public
  surface is a marketing site, a real-estate-investing blog, legal/policy pages, and a HackerOne-based
  security vulnerability disclosure program.'
